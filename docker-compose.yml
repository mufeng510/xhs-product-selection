services:
  app:
    image: ${IMAGE:-jerry0510/xhs-product-selection:latest}
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 默认使用 SQLite，数据文件位于卷内；如需 PostgreSQL 设置 DATABASE_URL 即可切换
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/app/xhs_selection.db}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  app_data:
